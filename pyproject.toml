[project]
name = "papersketch"
version = "0.1.0"
description = "Scientific diagrams and statistical plots with PaperBanana agents and Codex."
requires-python = ">=3.11,<3.13"
dependencies = [
    "google-genai>=1.49.0,<2",
    "pillow>=10.4.0",
    "json-repair>=0.30.0",
    "aiofiles>=23.2.1",
    "tqdm>=4.66.0",
    "matplotlib>=3.8,<4",
    "numpy>=1.26.4,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pyyaml>=6.0.1"]
